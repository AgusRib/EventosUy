<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"

<style>
:root {
	--bg: #f4f6f8;
	--surface: #ffffff;
	--text: #1f2937;
	--muted: #6b7280;
	--border: #e6e8eb;
	--accent: #6d5dfc;
	--accent-weak: #edeaff;
	--radius: 8px;
	--shadow: 0 6px 18px rgba(15, 23, 42, .06);
}

body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto,
		"Titillium Web", Arial, sans-serif;
	background: var(--bg);
	color: var(--text);
	margin: 0;
	padding-left: var(--sidebar-w);
	transition: padding-left .2s ease;
}

main
    main.contUser {
	padding: 18px;
}

.container-xl {
	max-width: 980px;
}

.card {
	border: 1px solid var(--border);
	border-radius: var(--radius);
	box-shadow: var(--shadow);
}

.form-label {
	font-weight: 600;
}
</style>
</head>

	<nav class="navbar bg-white shadow-sm">
		<div class="container-fluid h-100">
			<div class="row w-100 align-items-center h-100">
				<div
					class="col-2 col-md-1 col-lg-2 text-center text-md-start align-items-center h-100">
					<img class="logo" src="../assets/icons/Logo.png" alt="Logo">
				</div>
				<div
					class="col-8 col-md-8 col-lg-7 text-center align-items-center h-100">
					<b class="title"><a href="../index.html">Eventos.uy</a></b>
				</div>
				<div
					class="col-1 col-md-3 col-lg-3 d-flex justify-content-end align-items-center h-100">
					<div class="dropdown">
						<a class="d-flex align-items-center text-decoration-none" href="#"
							id="userMenuDropdown" data-bs-toggle="dropdown"
							aria-expanded="false" aria-haspopup="true"> <img
							src="/img/user-perfil/perfil-user-icono-def.png" alt="JA"
							class="rounded-circle"
							style="width: 38px; height: 38px; object-fit: cover; border: 1px solid rgba(0, 0, 0, .06);">
							<span class="d-none d-md-inline ms-2 fw-semibold">Jolgito</span>

						</a>

							aria-labelledby="userMenuDropdown">

									perfil</a></li>
							<li><hr class="dropdown-divider"></li>
							<li><a class="dropdown-item text-danger" href="/logout"><i

			</div>
		</div>
	</nav>
</header>

<body id="body-pd">
	<main class="contUser">
		<div class="container-xl">

			<!-- Header del formulario -->
			<section class="card mb-3">
				<div class="card-body d-flex align-items-center gap-3">
					<a href="/lab2/pages/MiPerfil.html"
						class="btn btn-light d-flex align-items-center justify-content-center p-2"
						style="width: 40px; height: 40px; border-radius: 50%;"> <i
						class='bx bx-chevron-left fs-4'></i>
					</a> <i class="bx bx-handshake fs-3"></i>
					<h2 class="mb-0 fw-bold">Alta de Patrocinio</h2>
				</div>
			</section>

			<!-- Formulario -->
			<section class="card mb-3">
				<div class="card-body">
					<form id="altaPatrocinioForm">

						<div class="mb-3">
							<label for="eventoSelect" class="form-label">Seleccionar
								evento</label> <select class="form-select" id="eventoSelect" required>
								<option value="">-- Seleccione un evento --</option>
								<option value="1">Evento A</option>
								<option value="2">Evento B</option>
								<option value="3">Evento C</option>
							</select>
						</div>

						<div class="mb-3" id="edicionWrapper" style="display: none;">
							<label for="edicionSelect" class="form-label">Seleccionar
								edición</label> <select class="form-select" id="edicionSelect" required>
								<option value="">-- Seleccione una edición --</option>
								<option value="1">Edición 1</option>
								<option value="2">Edición 2</option>
								<option value="3">Edición 3</option>
							</select>
						</div>

						<div class="mb-3" id="tipoRegistroWrapper" style="display: none;">
							<label for="tipoRegistroSelect" class="form-label">Tipo
								de registro</label> <select class="form-select" id="tipoRegistroSelect"
								required>
								<option value="">-- Seleccione un tipo de registro --</option>
								<option value="general">General</option>
								<option value="vip">VIP</option>
								<option value="early">Early Bird</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="institucionSelect" class="form-label">Institución</label>
							<select class="form-select" id="institucionSelect" required>
								<option value="">-- Seleccione una institución --</option>
								<option value="1">Institución A</option>
								<option value="2">Institución B</option>
								<option value="3">Institución C</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="nivelPatrocinio" class="form-label">Nivel de
								patrocinio</label> <select class="form-select" id="nivelPatrocinio"
								required>
								<option value="">-- Seleccione nivel --</option>
								<option value="platino">Platino</option>
								<option value="oro">Oro</option>
								<option value="plata">Plata</option>
								<option value="bronce">Bronce</option>
							</select>
						</div>

						<div class="mb-3">
							<label for="aporteEconomico" class="form-label">Aporte
								económico</label> <input type="number" class="form-control"
								id="aporteEconomico" placeholder="0.00" min="0" step="0.01"
								required>
						</div>

						<div class="mb-3">
							<label for="registrosGratuitos" class="form-label">Cantidad
								de registros gratuitos</label> <input type="number" class="form-control"
								id="registrosGratuitos" placeholder="0" min="0" required>
							<div class="form-text">No puede superar el 20% del aporte
								económico.</div>
						</div>

						<div class="mb-3">
							<label for="codigoPatrocinio" class="form-label">Código
								de patrocinio</label> <input type="text" class="form-control"
								id="codigoPatrocinio" placeholder="Ingrese el código" required>
						</div>

						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Registrar</button>
							<a href="/lab2/pages/MiPerfil.html" class="btn btn-secondary">Cancelar</a>
						</div>
					</form>
				</div>
			</section>

		</div>
	</main>

	<script>
    document.addEventListener('DOMContentLoaded', function() {
  // Ediciones por evento
  const edicionesPorEvento = {
    "1": [
      { value: "1", text: "Edición 1" },
      { value: "2", text: "Edición 2" }
    ],
    "2": [
      { value: "3", text: "Edición 3" }
    ],
    "3": [
      { value: "4", text: "Edición 4" },
      { value: "5", text: "Edición 5" }
    ]
  };

  // Tipos de registro por edición
  const tiposPorEdicion = {
    "1": [
      { value: "general", text: "General" },
      { value: "vip", text: "VIP" }
    ],
    "2": [
      { value: "early", text: "Early Bird" }
    ],
    "3": [
      { value: "general", text: "General" }
    ],
    "4": [
      { value: "vip", text: "VIP" },
      { value: "early", text: "Early Bird" }
    ],
    "5": [
      { value: "general", text: "General" }
    ]
  };

  const eventoSelect = document.getElementById('eventoSelect');
  const edicionSelect = document.getElementById('edicionSelect');
  const tipoRegistroSelect = document.getElementById('tipoRegistroSelect');
    const tipoRegistroWrapper = document.getElementById('tipoRegistroWrapper');

    // Evento cambia: actualiza ediciones y oculta tipo de registro
    eventoSelect.addEventListener('change', function() {
        const selectedEvento = eventoSelect.value;
        edicionSelect.innerHTML = '<option value="">-- Seleccione una edición --</option>';
        tipoRegistroSelect.innerHTML = '<option value="">-- Seleccione un tipo de registro --</option>';
        tipoRegistroWrapper.style.display = 'none';
        if (edicionesPorEvento[selectedEvento]) {
        edicionesPorEvento[selectedEvento].forEach(function(edicion) {
            const option = document.createElement('option');
            option.value = edicion.value;
            option.textContent = edicion.text;
            edicionSelect.appendChild(option);
        });
        edicionWrapper.style.display = '';
        } else {
        edicionWrapper.style.display = 'none';
        }
    });

    // Edición cambia: actualiza tipos de registro y muestra el campo si corresponde
    edicionSelect.addEventListener('change', function() {
        const selectedEdicion = edicionSelect.value;
        tipoRegistroSelect.innerHTML = '<option value="">-- Seleccione un tipo de registro --</option>';
        if (tiposPorEdicion[selectedEdicion]) {
        tiposPorEdicion[selectedEdicion].forEach(function(tipo) {
            const option = document.createElement('option');
            option.value = tipo.value;
            option.textContent = tipo.text;
            tipoRegistroSelect.appendChild(option);
        });
        tipoRegistroWrapper.style.display = '';
        } else {
        tipoRegistroWrapper.style.display = 'none';
        }
    });
    });
</script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
