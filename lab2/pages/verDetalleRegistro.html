<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Registro - Eventos.uy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/DetalleRegistro.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
    <link rel="icon" type="image/x-icon" href="../assets/icons/Logo.png">
</head>

<header>
    <nav class="navbar bg-white shadow-sm">
      <div class="container-fluid h-100">
        <div class="row w-100 align-items-center h-100">
          <div class="col-2 col-md-1 col-lg-2 text-center text-md-start align-items-center h-100">
            <img class="logo" src="../assets/icons/Logo.png" alt="Logo">
          </div>
          <div class="col-8 col-md-8 col-lg-7 text-center align-items-center h-100">
            <b class="title"><a href="../index.html">Eventos.uy</a></b>
          </div>
          <div class="col-1 col-md-3 col-lg-3 d-flex flex-column flex-md-row justify-content-end align-items-center h-100 gap-2" >
            <button class="button1 rounded-3">
                <div class="header-button  ">Iniciar sesión</div>
            </button>
            <button class="button2 rounded-3">
                <div class="header-button">Regístrate</div>
            </button>
          </div>
      </div>
    </nav>
</header>

<body>
    <div class="container d-flex flex-column align-items-center justify-content-center py-4">
      <div class="detalle-registro-container mb-4">
        <div class="carta-de-eventos">
          <input type="search" class="search detalle-registro-searchbar" placeholder="Buscar eventos, ediciones...">
        </div>
      </div>
      <div class="card shadow detalle-registro-card">
        <div class="card-body">
          <div class="d-flex flex-row align-items-center justify-content-center gap-5 mb-4">
            <img src="../assets/images/IMG-US01.jpg" alt="Foto Usuario" class="img-fluid rounded-circle detalle-registro-img-usuario">
            <img src="../assets/images/IMG-EDEV03.jpeg" alt="Foto Edición" class="img-fluid rounded detalle-registro-img-edicion">
          </div>
          <div class="info-evento text-center">
            <h1 class="mb-3">Detalle de Registro</h1>
            <div class="mb-2"><strong>Usuario:</strong> atorres</div>
            <div class="mb-2"><strong>Edición de Evento:</strong> Maratón Montevideo 2022</div>
            <div class="mb-2"><strong>Tipo de Registro:</strong> Corredor 21K</div>
            <div class="mb-2"><strong>Fecha de Registro:</strong> 30/07/2024</div>
            <div class="mb-2"><strong>Costo:</strong> $500</div>
          </div>
        </div>
      </div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
