<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alta de Evento — EVENTOS.UY</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    :root{
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e6e8eb;
      --accent:#6d5dfc;
      --accent-weak:#edeaff;
      --radius:8px;
      --shadow: 0 6px 18px rgba(15, 23, 42, .06);
    }
    body{
      font-family: "Titillium Web", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      padding-left:var(--sidebar-w);
      transition: padding-left .2s ease;
    }
    main.contUser { padding:18px; }
    .container-xl { max-width:980px; }
    .card {
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
    }
    .form-label { font-weight:600; }
  </style>
</head>

<header>
  <nav class="navbar bg-white shadow-sm">
    <div class="container-fluid h-100">
      <div class="row w-100 align-items-center h-100">
        <div class="col-2 col-md-1 col-lg-2 text-center text-md-start align-items-center h-100">
          <img class="logo" src="../assets/icons/Logo.png" alt="Logo">
        </div>
        <div class="col-8 col-md-8 col-lg-7 text-center align-items-center h-100">
          <b class="title"><a href="../index.html">EVENTOS.UY</a></b>
        </div>
      </div>
    </div>
  </nav>
</header>

<body id="body-pd">
<main class="contUser">
  <div class="container-xl">

    <!-- Header del formulario con botón volver -->
    <section class="card mb-3">
      <div class="card-body d-flex align-items-center gap-3">
        <a href="/lab2/pages/MiPerfil.html" class="btn btn-light d-flex align-items-center justify-content-center p-2" style="width:40px; height:40px; border-radius:50%;">
          <i class='bx bx-chevron-left fs-4'></i>
        </a>
        <i class="bx bx-calendar-plus fs-3"></i>
        <h2 class="mb-0 fw-bold">Alta de Evento</h2>
      </div>
    </section>

    <!-- Formulario -->
    <section class="card mb-3">
      <div class="card-body">
        <form id="altaEventoForm">

          <div class="mb-3">
            <label for="nombreEvento" class="form-label">Nombre del evento</label>
            <input type="text" class="form-control" id="nombreEvento" placeholder="Ingrese el nombre" required>
            <div class="invalid-feedback">Este nombre ya existe. Por favor ingrese otro.</div>
          </div>

          <div class="mb-3">
            <label for="siglaEvento" class="form-label">Sigla</label>
            <input type="text" class="form-control" id="siglaEvento" placeholder="Ej: EVT2025" required>
          </div>

          <div class="mb-3">
            <label for="descripcionEvento" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcionEvento" rows="3" placeholder="Ingrese la descripción del evento"></textarea>
          </div>

          <div class="mb-3">
            <label for="categoriasEvento" class="form-label">Categorías</label>
            <select class="form-select" id="categoriasEvento" multiple required>
              <option value="1">Conferencia</option>
              <option value="2">Taller</option>
              <option value="3">Networking</option>
              <option value="4">Seminario</option>
            </select>
            <small class="text-muted">Mantenga presionada la tecla Ctrl (Cmd en Mac) para seleccionar varias.</small>
          </div>

          <div class="mb-3">
            <label for="imagenEvento" class="form-label">Imagen del evento (opcional)</label>
            <input class="form-control" type="file" id="imagenEvento" accept="image/*">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/lab2/pages/MiPerfil.html" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById('altaEventoForm');
  const nombreInput = document.getElementById('nombreEvento');

  // Simulación de validación de nombre duplicado
  const nombresExistentes = ['Evento A', 'Evento B', 'Evento C'];

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (nombresExistentes.includes(nombreInput.value.trim())) {
      nombreInput.classList.add('invalido');
      nombreInput.focus();
    } else {
      nombreInput.classList.remove('invalido');
      alert('Evento dado de alta correctamente');
      form.reset();
    }
  });
</script>

</body>
</html>
