<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Eventos.uy</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
    <link rel="icon" type="image/x-icon" href="assets/icons/Logo.png">    <!-- Icono de la pestaña -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Evento - Eventos.uy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
    <link rel="icon" type="image/x-icon" href="../assets/icons/Logo.png">
</head>
<body>

    <div class="container d-flex justify-content-center">
    <div class="col-md-5 col-lg-7 col-13"> <!-- Contenedor centrado con Bootstrap -->

    <!-- Contenedor del formulario -->

    <div class="col-md-5 col-lg-7 col-xxl-9 mt-3 mt-sm-3 mt-md-0 Registro base text-center">
      <h1 class="mb-5"><strong>Eventos.uy</strong></h1>
      <h3 class="mb-4"><strong>Registrarse</strong></h3>
      
      <p class="mb-3 ">Introduce tus datos de usuario para crear una cuenta nueva</p>
        <form>
            <div class="mb-3">
            <!--<label for="nickname" class="form-label">Apodo (nickname)</label>-->
                <input type="text" class="form-control" id="nickname" placeholder="Apodo">
            </div>
            <div class="mb-3">
            <!--<label for="nombre" class="form-label">Nombre</label>-->
                <input type="text" class="form-control" id="nombre" placeholder="Nombre">
            </div>
            <div class="mb-3">
            <!--<label for="email" class="form-label">Correo electrónico</label>-->
                <input type="email" class="form-control" id="email" placeholder="Correo electrónico">
            </div>
            <div class="mb-3">
            <!--<label for="contraseña" class="form-label">Contraseña</label> -->
                <input type="password" class="form-control" id="contraseña" placeholder="Contraseña">
            </div>
            <div class="mb-3">
            <!--<label for="confirmaContraseña" class="form-label">Confirmación de contraseña</label>-->
                <input type="password" class="form-control" id="confirmaContraseña" placeholder="Confirmación de contraseña">
            </div>
            <div class="mb-3">
            <!--<label for="imgPerfil" class="form-label">Insertar imagen de perfil</label>-->
                <input type="file" class="form-control" id="imgPerfil" placeholder="Imagen de perfil"> 
            </div><data value=""></data>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="tipoUsuario">
                <label class="form-check-label" for="tipoUsuario">¿Es usted organizador/a?</label>
            </div>
                <button type="submit" class="btn btn-dark">Continuar</button>
        </form>
            
    </div>
</body>
</html>
