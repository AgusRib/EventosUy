<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Evento - Eventos.uy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
    <link rel="stylesheet" href="../assets/css/styles.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
    <link rel="stylesheet" href="../assets/css/styles.css">

    </head>

 <header>
        <nav class="navbar bg-white shadow-sm" style="height: 86px;">
            <div class="d-flex align-items-center">
                <a class="fw-bold text-dark fs-2 ms-4 text-decoration-none" href="index.html">Eventos.uy</a>
            </div>
            <div class="header-auth m-3">
                                <a href="InicioDeSesion.html" class="text-decoration-none">
                                    <button type="button" class="button1 rounded-3">
                                        <div class="header-button">Iniciar sesión</div>
                                    </button>
                                </a>
                                <a href="RegistroBase.html" class="text-decoration-none">
                                    <button type="button" class="button2 rounded-3">
                                        <div class="header-button">Regístrarse</div>
                                    </button>
                                </a>
            </div>
        </nav>
    </header>
    
    
<body>

    <div class="container d-flex justify-content-center">
    <div class="col-md-5 col-lg-7 col-13"> <!-- Contenedor centrado con Bootstrap -->

    <!-- Contenedor del formulario -->

    <div class="col-md-5 col-lg-7 col-xxl-9 mt-3 mt-sm-3 mt-md-0 Registro base text-center">
        <h1 class="mb-5"><strong></strong></h1>
        <h3 class="mb-4"><strong>Ya casi terminamos...</strong></h3>
        <p class="mb-3">Introduce estos últimos datos como ASISTENTE</p>
          <form>
            <!--apellido y fecha-->
              <div class="mb-3">
                <input type="text" class="form-control" id="Apellido" placeholder="Apellido">
              </div>
              <div class="mb-3">
                <input type="date" class="form-control" id="fechaNacimiento" placeholder="Fecha de nacimiento (AAAA-MM-DD)">
              </div>
            <!--elegidor institucion al estilo ConsultaEvento
            
                FALTA CORREGIR TAMAÑO VERTICAL
            
            -->
              <div>
                <label for="carta-categorias-consulta" class="form-label">Si perteneces a una institución, seleccionala.</label>
              </div>
              <div class="mt-3 mt-md-0 d-flex justify-content-center">
                    <div class="carta-categorias-consulta overflow-auto" style="max-height: 325px;">
                      <h4 class="categorias-consulta">Institución</h4>
                      <ul class="lista-categoria-consulta">
                        <li class="categoria-item">Facultad de Ingeniería</li>
                        <li class="categoria-item">ORT Uruguay</li>
                        <li class="categoria-item">Universidad Católica del Uruguay</li>
                        <li class="categoria-item">Antel</li>
                        <li class="categoria-item">Agencia Nacional de Investigación e Innovación (ANII)</li>
                      </ul>
                    </div>
                  </div>


              <button type="submit" class="btn btn-dark">Finalizar</button>
          </form>
            
    </div>

    <!-- FINALIZAR ALTA USUARIO  -->
    <script>
    document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = '../index.html';
    });
    </script>

</body>
</html>
