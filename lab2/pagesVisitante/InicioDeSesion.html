 <header>

<body>
    
    <div class="container d-flex justify-content-center">
    <div class="col-md-5 col-lg-7 col-13"> <!-- Contenedor centrado con Bootstrap -->

    <!-- Contenedor del formulario -->

    <div class="col-md-5 col-lg-7 col-xxl-9 mt-3 mt-sm-3 mt-md-0 inicioSesion text-center">
        <h1 class="mb-5"><strong></strong></h1>
        <h3 class="mb-4"><strong>Inicio de Sesión</strong></h3>

        <p class="mb-3"></p>
          <form>
            <!--apellido y fecha-->
              <div class="mb-3">
                <input type="text" class="form-control" id="nickOmail" placeholder="Apodo (nickname) o mail">
              </div>
              <div class="mb-3">
                <input type="password" class="form-control" id="contraseña" placeholder="Contraseña">
              </div>

              <button type="submit" class="btn btn-dark">Ingresar</button>
          </form>
            
    </div>

    <!-- FINALIZAR INICIO SESION  -->
    <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('nickOmail').value.trim().toLowerCase();
      const pass = document.getElementById('contraseña').value;
      if ((user === 'atorres' || user === 'atorres@gmail.com') && pass === '123.torres') {
        window.location.href = '../pagesAsistente/index.html';
      } else if ((user === 'miseventos' || user === 'contacto@miseventos.com') && pass === '22miseventos') {
        window.location.href = '../pagesOrganizador/index.html';
      } else {
        alert('Datos incorrectos');
      }
    });
    </script>
    
</body>
