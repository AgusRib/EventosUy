<style>
:root {
	--bg: #f4f6f8;
	--surface: #ffffff;
	--text: #1f2937;
	--muted: #6b7280;
	--border: #e6e8eb;
	--accent: #6d5dfc;

	--shadow: 0 6px 18px rgba(15, 23, 42, .06);
}

body {
	font-family: "Titillium Web", system-ui, -apple-system, "Segoe UI",
		Roboto, Arial, sans-serif;
	background: var(--bg);
	color: var(--text);
	margin: 0;
	padding-left: var(--sidebar-w);
	transition: padding-left .2s ease;
}

main.contUser {
	padding: 18px;
}

.container-xl {
	max-width: 980px;
}

.card {
	border: 1px solid var(--border);
	border-radius: var(--radius);
	box-shadow: var(--shadow);
}

.form-label {
	font-weight: 600;
}
</style>
</head>

<header>
	<nav class="navbar bg-white shadow-sm">
		<div class="d-flex align-items-center">
			<a class="fw-bold text-dark fs-2 ms-4 text-decoration-none"

		</div>

			<div class="dropdown">
				<a class="d-flex align-items-center text-decoration-none gap-2 m-3"
					href="#" id="userMenuDropdown" data-bs-toggle="dropdown"
					aria-expanded="false" aria-haspopup="true"> <img
					src="../assets/images/IMG-US01.jpg" alt="JA" class="rounded-circle"
					style="width: 38px; height: 38px; object-fit: cover; border: 1px solid rgba(0, 0, 0, .06);">
					<span>Ana</span> <i class="bi bi-chevron-down"></i>
				</a>
				<ul class="dropdown-menu dropdown-menu-end shadow-sm"
					aria-labelledby="userMenuDropdown">
					<li><a class="dropdown-item" href="MiPerfil-atorres.html">Mi
							perfil</a></li>
					<li>
						<hr class="dropdown-divider">
					</li>
					<li><a class="dropdown-item text-danger"
						href="../pagesVisitante/index.html"
						style="color: #dc3545 !important;">Cerrar sesión</a></li>
				</ul>
			</div>
		</div>
	</nav>
</header>

<body id="body-pd">
	<main class="contUser">
		<div class="container-xl">

			<!-- Header del formulario -->
			<section class="card mb-3">
				<div class="card-body d-flex align-items-center gap-3">
					<a href="/lab2/pages/MiPerfil.html"
						class="btn btn-light d-flex align-items-center justify-content-center p-2"
						style="width: 40px; height: 40px; border-radius: 50%;"> <i
						class='bx bx-chevron-left fs-4'></i>
					</a> <i class="bx bx-user-plus fs-3"></i>
					<h2 class="mb-0 fw-bold">Registro a Edición</h2>
				</div>
			</section>

			<!-- Formulario -->
			<section class="card mb-3">
				<div class="card-body">
					<form id="registroEdicionForm">

						<!-- Campos de evento y edición como textos arriba de las imágenes -->
						<div
							class="mb-3 d-flex flex-column align-items-center justify-content-center">
							<label class="form-label">Mobile World Congress 2025</label> <img
								src="../assets/images/IMG-EDEV09.png" alt="Imagen Edición"
								class="img-fluid rounded"
								style="width: 120px; height: 120px; object-fit: cover;">
						</div>

						<div class="mb-3">
							<label for="tipoRegistroSelect" class="form-label">Tipo
								de registro</label> <select class="form-select" id="tipoRegistroSelect"
								required>
								<option value="">-- Seleccione un tipo de registro --</option>
								<option value="general">Full</option>
							</select>
						</div>

						<div class="mb-3">
							<label class="form-label">Forma de registro</label>
							<div class="form-check">
								<input class="form-check-input" type="radio"
									name="formaRegistro" id="formaGeneral" value="general" checked>
								<label class="form-check-label" for="formaGeneral">General</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio"
									name="formaRegistro" id="formaPatrocinio" value="patrocinio">
								<label class="form-check-label" for="formaPatrocinio">Usando
									código de patrocinio</label>
							</div>
						</div>

						<div class="mb-3" id="codigoPatrocinioDiv" style="display: none;">
							<label for="codigoPatrocinio" class="form-label">Código
								de patrocinio</label> <input type="text" class="form-control"
								id="codigoPatrocinio" placeholder="Ingrese el código">
						</div>

						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Registrar</button>
							<a href="ConsultaDeEdicionMobileCongress2025.html"
								class="btn btn-secondary">Cancelar</a>
						</div>
					</form>
				</div>
			</section>

		</div>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
  document.querySelectorAll('input[name="formaRegistro"]').forEach(el => {
    el.addEventListener('change', function() {
      document.getElementById('codigoPatrocinioDiv').style.display =
        this.value === 'patrocinio' ? 'block' : 'none';
    });
  });

  const codigoInput = document.getElementById('codigoPatrocinio');
  document.getElementById('registroEdicionForm').addEventListener('submit', function(e) {
    const forma = document.querySelector('input[name="formaRegistro"]:checked').value;
    
      e.preventDefault();
      codigoInput.classList.add('is-invalid');
      alert('Código inválido');
    
  });
</script>


</body>
</html>
