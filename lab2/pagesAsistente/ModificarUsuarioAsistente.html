<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modificar Perfil — Eventos.uy</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap"
	rel="stylesheet">
<link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">


<style>
:root {
	--bg: #f4f6f8;
	--surface: #ffffff;
	--text: #1f2937;
	--muted: #6b7280;
	--border: #e6e8eb;
	--accent: #6d5dfc;
	--accent-weak: #edeaff;
	--radius: 8px;
	--shadow: 0 6px 18px rgba(15, 23, 42, .06);
}

body {
	font-family: 'Inter';
	background: var(--bg);
	color: var(--text);
	margin: 0;
	padding-left: var(--sidebar-w);
	transition: padding-left .2s ease;
}

main.contUser {
	padding: 18px;
}

.container-xl {
	max-width: 980px;
}

.card {
	border: 1px solid var(--border);
	border-radius: var(--radius);
	box-shadow: var(--shadow);
}

.form-label {
	font-weight: 600;
}

.avatar-preview {
	width: 80px;
	height: 80px;
	border-radius: 50%;
	object-fit: cover;
	border: 2px solid var(--accent-weak);
}
</style>
</head>

<header>
	<nav class="navbar bg-white shadow-sm">
		<div class="d-flex align-items-center">
			<a class="fw-bold text-dark fs-2 ms-4 text-decoration-none"
				href="index.html">Eventos.uy</a>
		</div>
		<div class="d-flex justify-content-end align-items-center">
			<div class="dropdown">
				<a class="d-flex align-items-center text-decoration-none gap-2 m-3"
					href="#" id="userMenuDropdown" data-bs-toggle="dropdown"
					aria-expanded="false" aria-haspopup="true"> <img
					src="../assets/images/IMG-US01.jpg" alt="JA" class="rounded-circle"
					style="width: 38px; height: 38px; object-fit: cover; border: 1px solid rgba(0, 0, 0, .06);">
					<span>Ana</span> <i class="bi bi-chevron-down"></i>
				</a>
				<ul class="dropdown-menu dropdown-menu-end shadow-sm"
					aria-labelledby="userMenuDropdown">
					<li><a class="dropdown-item" href="MiPerfil-atorres.html">Mi
							perfil</a></li>
					<li>
						<hr class="dropdown-divider">
					</li>
					<li><a class="dropdown-item text-danger"
						href="../pagesVisitante/index.html"
						style="color: #dc3545 !important;">Cerrar sesión</a></li>
				</ul>
			</div>
		</div>
	</nav>
</header>

<body id="body-pd">
	<main class="contUser">
		<div class="container-xl">

			<!-- Header del formulario -->
			<section class="card mb-3">
				<div class="card-body d-flex align-items-center gap-3">
					<a href="MiPerfil-atorres.html"
						class="btn btn-light d-flex align-items-center justify-content-center p-2"
						style="width: 40px; height: 40px; border-radius: 50%;"> <i
						class='bx bx-chevron-left fs-4'></i>
					</a> <i class="bx bx-user fs-3"></i>
					<h2 class="mb-0 fw-bold">Modificar Perfil</h2>
				</div>
			</section>

			<!-- Formulario de edición -->
			<section class="card mb-3">
				<div class="card-body">
					<form id="modificarPerfilForm">
						<div class="mb-3 text-center">
							<img id="avatarPreview" src="../assets/images/IMG-US01.jpg"
								alt="Avatar" class="avatar-preview mb-2"> <input
								class="form-control" type="file" id="avatarInput"
								accept="image/*">
						</div>

						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="nombre" class="form-label">Nombre</label> <input
									type="text" class="form-control" id="nombre" value="Ana"
									required>
							</div>
							<div class="col-md-6 mb-3">
								<label for="apellido" class="form-label">Apellido</label> <input
									type="text" class="form-control" id="apellido" value="Torres"
									required>
							</div>
						</div>

						<div class="mb-3">
							<label for="fechaNacimiento" class="form-label">Fecha de
								nacimiento</label> <input type="date" class="form-control"
								id="fechaNacimiento" value="1990-05-12">
						</div>



						<div class="mb-3">
							<label class="form-label">Nickname</label> <input type="text"
								class="form-control" value="atorres" disabled>
						</div>

						<div class="mb-3">
							<label class="form-label">Correo electrónico</label> <input
								type="email" class="form-control" value="atorres@gmail.com"
								disabled>
						</div>

						<hr>

						<div class="mb-3">
							<label for="password" class="form-label">Nueva contraseña</label>
							<input type="password" class="form-control" id="password"
								placeholder="Dejar en blanco si no cambia">
						</div>

						<div class="d-flex gap-2">
							<button type="submit" class="btn btn-primary">Guardar</button>
							<a href="MiPerfil-atorres.html" class="btn btn-secondary">Cancelar</a>
						</div>
					</form>
				</div>
			</section>

		</div>
	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
  const avatarInput = document.getElementById('avatarInput');
  const avatarPreview = document.getElementById('avatarPreview');

  avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file){
      avatarPreview.src = URL.createObjectURL(file);
    }
  });

  document.getElementById('modificarPerfilForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // Aquí enviarías los datos al backend mediante fetch/AJAX
    alert('Perfil actualizado correctamente.');
  });
</script>
</body>
</html>
