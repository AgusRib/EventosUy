  <style>
    :root{
      --bg: #f4f6f8;
      --surface: #ffffff;

        <nav class="navbar bg-white shadow-sm">

                    <a class="d-flex align-items-center text-decoration-none gap-2 m-3" href="#" id="userMenuDropdown"

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenuDropdown">
      <li><a class="dropdown-item" href="MiPerfil-misEventos.html">Mi perfil</a></li>

                    </ul>

<body id="body-pd">
<main class="contUser">
  <div class="container-xl">

    <!-- Header del formulario con botón volver -->
    <section class="card mb-3">
      <div class="card-body d-flex align-items-center gap-3">
        <a href="MiPerfil-misEventos.html" class="btn btn-light d-flex align-items-center justify-content-center p-2" style="width:40px; height:40px; border-radius:50%;">
          <i class='bx bx-chevron-left fs-4'></i>
        </a>
        <i class="bx bx-calendar-plus fs-3"></i>
        <h2 class="mb-0 fw-bold">Alta de Evento</h2>
      </div>
    </section>

    <!-- Formulario -->
    <section class="card mb-3">
      <div class="card-body">
        <form id="altaEventoForm">

          <div class="mb-3">
            <label for="nombreEvento" class="form-label">Nombre del evento</label>
            <input type="text" class="form-control" id="nombreEvento" placeholder="Ingrese el nombre" required>
            <div class="invalid-feedback">Este nombre ya existe. Por favor ingrese otro.</div>
          </div>

          <div class="mb-3">
            <label for="siglaEvento" class="form-label">Sigla</label>
            <input type="text" class="form-control" id="siglaEvento" placeholder="Ej: EVT2025" required>
          </div>

          <div class="mb-3">
            <label for="descripcionEvento" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcionEvento" rows="3" placeholder="Ingrese la descripción del evento"></textarea>
          </div>

          <div class="mb-3">
            <label for="categoriasEvento" class="form-label">Categorías</label>
            <select class="form-select" id="categoriasEvento" multiple required>
              <option value="1">Conferencia</option>
              <option value="2">Taller</option>
              <option value="3">Networking</option>
              <option value="4">Seminario</option>
            </select>
            <small class="text-muted">Mantenga presionada la tecla Ctrl (Cmd en Mac) para seleccionar varias.</small>
          </div>

          <div class="mb-3">
            <label for="imagenEvento" class="form-label">Imagen del evento (opcional)</label>
            <input class="form-control" type="file" id="imagenEvento" accept="image/*">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="MiPerfil-misEventos.html" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById('altaEventoForm');
  const nombreInput = document.getElementById('nombreEvento');

  // Simulación de validación de nombre duplicado
  const nombresExistentes = ['Evento A', 'Evento B', 'Evento C'];

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (nombresExistentes.includes(nombreInput.value.trim())) {
      nombreInput.classList.add('invalido');
      nombreInput.focus();
    } else {
      nombreInput.classList.remove('invalido');
      alert('Evento dado de alta correctamente');
      form.reset();
    }
  });
</script>

</body>
</html>
