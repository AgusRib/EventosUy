<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Edición - Eventos.uy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
  <link rel="icon" type="image/x-icon" href="../assets/icons/Logo.png">
</head>

<body>
    <header>
        <nav class="navbar bg-white shadow-sm" style="height: 86px;">
            <div class="text-center align-items-center">
                <a class="fw-bold text-dark fs-2 m-4 text-decoration-none"
                    href="index.html"><img class="logo" alt="logo" src="assets/icons/Logo.png"></a>
            </div>
        <div class="header-auth m-3">
            <button class="button1 rounded-3">
                <div class="header-button">Iniciar sesión</div>
            </button>
            <button class="button2 rounded-3">
                <div class="header-button">Regístrate</div>
            </button>
        </div>
            </div>
        </nav>
    </header>
    
  <div class="container-fluid px-4 mt-4">
    <div class="carta-de-eventos mb-4">
      <input type="search" class="search" placeholder="Buscar ediciones...">
    </div>
  </div>

  <div class="container-fluid px-4 mt-3">
    <div class="row pb-4">
      <!-- Imagen de la edición -->
      <div class="col-md-4 col-lg-3 col-xxl-2 px-5">
        <img src="../assets/images/maraton2025.jpg" alt="Imagen de la Edición" class="img-fluid rounded">
      </div>

      <!-- Información principal de la edición -->
      <div class="col-md-5 col-lg-7 col-xxl-8 mt-3 mt-md-0 info-evento">
        <h1 class="mb-3">Maratón Montevideo 2022</h1>
        <p class="mb-2"><strong>Organizador:</strong> Empresa de organización de eventos.</p>
        <p class="mb-2"><strong>Fecha:</strong> 14/09/2022</p>
        <p class="mb-2"><strong>Descripción:</strong> La edición 2022 del Maratón de Montevideo con novedades y actividades para toda la familia.</p>
        <p class="mb-1"><strong>Ciudad:</strong> Montevideo</p>
        <p class="mb-0"><strong>País:</strong> Uruguay</p>


      </div>

      <!-- Columna derecha: categorías (opcional) -->
      <div class="col-md-3 col-lg-2 col-xxl-2 mt-3 mt-md-0">
        <div class="carta-categorias-consulta">
          <h3 class="categorias-consulta">Categorías</h3>
          <ul class="lista-categoria-consulta">
            <li class="categoria-item">Deporte</li>
            <li class="categoria-item">Salud</li>
            <li class="categoria-item">Cultura</li>
            <li class="categoria-item">Tecnología</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Ejemplo de control de visibilidad según rol
    const rolUsuario = 'organizador'; // 'organizador', 'asistente' o 'visitante'

    if(rolUsuario === 'organizador') {
      document.getElementById('organizador-section').style.display = 'block';
    } else if(rolUsuario === 'asistente') {
      document.getElementById('asistente-section').style.display = 'block';
    }
  </script>
</body>
</html>
