<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />

  <title>Alta Tipo de Registro — Eventos.uy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/ConsultaEvento.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap" />
  
  <style>
    :root{
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e6e8eb;
      --accent:#6d5dfc;
      --accent-weak:#edeaff;
      --radius:8px;
      --shadow: 0 6px 18px rgba(15, 23, 42, .06);
    }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Titillium Web", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      padding-left:var(--sidebar-w);
      transition: padding-left .2s ease;
    }
    main
    main.contUser { padding:18px; }
    .container-xl { max-width:980px; }
    .card {
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
    }
    .avatar { width:64px; height:64px; border-radius:50%; border:2px solid var(--accent-weak); object-fit:cover; background:#fff; }
    .form-label { font-weight:600; }
  </style>
</head>

<header>
        <nav class="navbar bg-white shadow-sm">
            <div class="text-center align-items-center">
                <a class="fw-bold text-dark fs-2 m-4 text-decoration-none" href="index.html"><b>Eventos.uy</b></a>
            </div>
            <div class="d-flex justify-content-end align-items-center">
                <div class="dropdown">
                    <a class="d-flex align-items-center text-decoration-none gap-2 m-3" href="#" id="userMenuDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="true">
                        <img src="../assets/images/IMG-US04.jpeg" alt="JA" class="rounded-circle"
                            style="width:38px; height:38px; object-fit:cover; border:1px solid rgba(0,0,0,.06);">
                        <span>MisEventos</span>
                        <i class="bi bi-chevron-down"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenuDropdown">
      <li><a class="dropdown-item" href="MiPerfil-misEventos.html">Mi perfil</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="../pagesVisitante/index.html" style="color:#dc3545 !important;">Cerrar sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
<body id="body-pd">
<main class="contUser">
  <div class="container-xl">

    <!-- Header del formulario -->
    <section class="card mb-3">
       <div class="card-body d-flex align-items-center gap-3">
           <a href="MiPerfil-misEventos.html" class="btn btn-light d-flex align-items-center justify-content-center p-2" style="width:40px; height:40px; border-radius:50%;">
              <i class='bx bx-chevron-left fs-4'></i>
           </a>
              <i class="bx bx-list-plus fs-3"></i>
           <h2 class="mb-0 fw-bold">Alta Tipo de Registro</h2>
        </div>
    </section>

    <!-- Formulario -->
    <section class="card mb-3">
      <div class="card-body">
        <form id="tipoRegistroForm">

          <div class="mb-3">
            <label for="nombreTipo" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreTipo" placeholder="Ingrese el nombre" required>
          </div>

          <div class="mb-3">
            <label for="descripcionTipo" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcionTipo" rows="3" placeholder="Descripción del tipo de registro"></textarea>
          </div>

          <div class="mb-3">
            <label for="costoTipo" class="form-label">Costo</label>
            <input type="number" class="form-control" id="costoTipo" placeholder="0.00" min="0" step="0.01" required>
          </div>

          <div class="mb-3">
            <label for="cupoTipo" class="form-label">Cupo</label>
            <input type="number" class="form-control" id="cupoTipo" placeholder="Cantidad de registros" min="1" required>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="MiPerfil-misEventos.html" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
